name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -c "import app.main"
        env:
          JWT_SECRET: ci-only-secret-not-used-in-prod-000000000000
          ENCRYPTION_KEY: ci-only-key-not-used-in-prod-00000000000000
      - run: pytest -v
        env:
          JWT_SECRET: ci-only-secret-not-used-in-prod-000000000000
          ENCRYPTION_KEY: ci-only-key-not-used-in-prod-00000000000000
      # continue-on-error: a auditoria so avisa no log, nao quebra o build por causa de uma
      # CVE de dependencia (o ecdsa saiu quando o python-jose foi trocado pelo PyJWT).
      - run: pip install pip-audit -q && pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (sem subir containers)
        run: docker compose -f docker-compose.dev.yml build

  # So publica no GHCR quando uma tag de versao (v0.1.0, v1.2.3, etc) e empurrada -- push
  # normal em main so builda pra validar (job acima), nao gera imagem publicada.
  docker-publish:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Extrai a versao da tag
        id: version
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build e push do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}-backend:latest
      - name: Build e push do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}-frontend:latest

  # Cria a Release no GitHub com as notas da versao, tiradas do mesmo historico que a aba Atualizacoes mostra
  # (backend/app/changelog/CHANGELOG.md). Fica num job a parte, depois da publicacao das imagens: se falhar, a
  # imagem ja esta publicada e nada para de funcionar. Sem a versao no arquivo, cai para as notas automaticas.
  github-release:
    runs-on: ubuntu-latest
    needs: [docker-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cria a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "A Release $tag ja existe."
            exit 0
          fi
          if title=$(python3 .github/scripts/release_notes.py "$version" "$tag" titulo) \
            && python3 .github/scripts/release_notes.py "$version" "$tag" > notas.md; then
            gh release create "$tag" --verify-tag --latest --title "v${version} - ${title}" --notes-file notas.md
          else
            gh release create "$tag" --verify-tag --latest --title "v${version}" --generate-notes
          fi
