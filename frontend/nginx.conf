server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguranca basicos -- SAMEORIGIN (nao DENY) porque o proprio app roda em iframe
    # em nenhum lugar, mas usa embeds do Power BI (isso e o app framing conteudo de terceiros,
    # nao o contrario, entao nao afeta esse header).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compressao: sem isso o JavaScript, o CSS e o JSON da API saem em tamanho bruto (o bundle
    # principal tem ~270 KB e cai para ~80 KB com gzip). `gzip_proxied any` vale tambem para a
    # resposta do backend e para pedidos que chegam por outro proxy (que mandam o cabecalho Via);
    # sem ele o nginx nao comprime nesses casos. Imagens e fontes ja sao comprimidas por natureza.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite) podem cachear por muito tempo com seguranca --
    # um deploy novo gera nomes de arquivo diferentes, nunca reaproveita um cache velho.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy reverso pro backend -- assim a porta 8000 nao precisa ficar exposta no host,
    # o frontend fala com o backend pela rede interna do compose (VITE_API_URL=/api).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos estaticos gerados pelo backend (thumbnails de relatorios, logos enviados, etc.)
    # ficam em /app/static/ no container backend; o frontend proxeia pra servir pelo mesmo host.
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 10m;
        add_header Cache-Control "public, max-age=600";
    }
}
