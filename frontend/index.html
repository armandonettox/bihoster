<!doctype html>
<!-- A interface e toda em portugues: lang pt-BR e translate="no" evitam que o navegador ofereca traduzir a pagina.
         Traduzir quebra a tela, porque os icones sao texto em ingles (home, dark_mode...) trocado por uma fonte de icones. -->
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIHoster</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
